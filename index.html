<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The build writes a script here that applies the stored or system theme before anything is painted (vite.config.ts). -->
    <!--first-paint-->
    <meta name="description" content="Valence: a molecule explorer and virtual general-chemistry lab for self-directed learners." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Link previews. Crawlers need absolute addresses, so these name the public copy; a copy hosted elsewhere can change them. -->
    <meta property="og:title" content="Valence" />
    <meta property="og:description" content="Valence is a free, open-source chemistry lab and molecule explorer that runs in the browser, with no account needed." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://firetailfab.com/valence/" />
    <meta property="og:image" content="https://firetailfab.com/valence/social-card.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="The Valence logo and the words &quot;A free, open-source chemistry lab in your browser&quot;, beside a screenshot of the red cabbage pH lab's rack of coloured tubes." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Valence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
